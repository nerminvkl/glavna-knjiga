{% extends 'layouts/blank.html' %}
{% load static %}
{% block content %}
<div class="portal">
  <img src="/static/images/wallpapers/{{ bg_pozadina }}" class="bg-img" alt="bg">
  <div class="overlay"></div>
  {% include 'a_home/topbar.html' %}

  <div class="up-page" style="align-items:center; justify-content:center;">
    <div style="width:100%; max-width:480px;">
      <div style="color:rgba(255,255,255,0.4); font-size:13px; margin-bottom:12px;">
        <a href="{% url 'obracuni_placa' partner.id %}" style="color:rgba(255,255,255,0.4); text-decoration:none;">← Obračuni plaća</a>
      </div>
      <div style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:28px;">
        <div style="color:#fff; font-size:18px; font-weight:700; margin-bottom:20px;">Novi obračun plaća</div>
        <form method="post" style="display:flex; flex-direction:column; gap:14px;">
          {% csrf_token %}
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="color:rgba(255,255,255,0.4); font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;">MJESEC</label>
            <select name="mjesec" required
              style="background:rgba(255,255,255,0.07) !important; border:1px solid rgba(255,255,255,0.12) !important; border-radius:9px !important; color:#fff !important; font-family:'Inter',sans-serif !important; font-size:14px !important; padding:10px 14px !important; outline:none !important; width:100% !important; box-sizing:border-box !important; appearance:none !important;">
              {% for m in mjeseci %}
              <option value="{{ m }}">{{ m|stringformat:"02d" }} / {{ godina.godina }}</option>
              {% endfor %}
            </select>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="color:rgba(255,255,255,0.4); font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;">NAZIV (opciono)</label>
            <input type="text" name="naziv" placeholder="Npr. Plaće za maj 2026"
              style="background:rgba(255,255,255,0.07) !important; border:1px solid rgba(255,255,255,0.12) !important; border-radius:9px !important; color:#fff !important; font-family:'Inter',sans-serif !important; font-size:14px !important; padding:10px 14px !important; outline:none !important; width:100% !important; box-sizing:border-box !important;">
          </div>
          <div style="background:rgba(96,165,250,0.08); border:1px solid rgba(96,165,250,0.2); border-radius:10px; padding:12px 16px; font-size:12px; color:rgba(255,255,255,0.6);">
            ℹ️ Svi aktivni zaposlenici će biti automatski dodani u obračun.
          </div>
          <div style="display:flex; gap:10px; padding-top:4px;">
            <button type="submit" style="background:#2563eb !important; color:#fff !important; border:none !important; border-radius:9px !important; padding:12px 28px !important; font-size:14px !important; font-weight:600 !important; cursor:pointer !important; font-family:'Inter',sans-serif !important;">
              Kreiraj obračun
            </button>
            <a href="{% url 'obracuni_placa' partner.id %}" style="background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.12); border-radius:9px; padding:12px 20px; font-size:14px; text-decoration:none; display:inline-flex; align-items:center;">
              Odustani
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<style>
.up-page { position:relative; z-index:10; min-height:100vh; padding:90px 32px 40px; box-sizing:border-box; font-family:'Inter',sans-serif; display:flex; flex-direction:column; }
</style>
<script>
function updateTime() {
  const now = new Date();
  document.getElementById('dt-time').textContent = now.toLocaleTimeString('bs-BA',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('dt-date').textContent = now.toLocaleDateString('bs-BA',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
setInterval(updateTime,1000); updateTime();
</script>
{% endblock %}
